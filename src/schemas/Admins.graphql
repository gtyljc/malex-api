
# -------- mutation

extend type Query {
    
    # <GUEST> role is required
    # returns current key to access admin panel
    adminPanelKey: AdminPanelKeyResponse @auth(role: GUEST)
}


# -------- types


type AdminPanelKeyResponse implements APIResponseInterface {
    code: Int!
    message: String!
    success: Boolean!
    data: [ String ]!
}